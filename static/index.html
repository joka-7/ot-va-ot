<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a17" media="(prefers-color-scheme: dark)">
  <meta name="description" content="חיפוש פסוק בתנ״ך לפי האות הראשונה והאחרונה של השם, לפי המנהג לומר פסוק לשם בסוף תפילת העמידה.">
  <title>פסוק לשם — חיפוש פסוקים בתנ״ך לפי שם</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <h1 class="title">פסוק לשם</h1>
      <p class="subtitle">מציאת פסוקים בתנ״ך המתחילים ומסתיימים באותיות השם</p>
    </div>
  </header>

  <main class="wrap" id="main">
    <form class="search" id="search-form" autocomplete="off">
      <label class="label" for="names">שם, או שני שמות מופרדים בפסיק</label>
      <div class="field">
        <input
          class="input" id="names" name="names" type="text"
          placeholder="לדוגמה: אברהם, שרה"
          enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false"
          aria-describedby="hint">
        <button class="submit" type="submit" id="submit">
          <span class="submit-text">חיפוש</span>
        </button>
      </div>
      <p class="hint" id="hint">שם אחד — פסוקים לשם. שני שמות — גם פסוקים סמוכים לזוג.</p>
      <div class="chips" id="examples" role="group" aria-label="דוגמאות">
        <button class="chip" type="button" data-q="אברהם">אברהם</button>
        <button class="chip" type="button" data-q="שרה">שרה</button>
        <button class="chip" type="button" data-q="אברהם, שרה">אברהם, שרה</button>
        <button class="chip" type="button" data-q="דוד, מיכל">דוד, מיכל</button>
      </div>
    </form>

    <section id="results" class="results" aria-live="polite" aria-busy="false"></section>
  </main>

  <footer class="footer wrap">
    <p>
      נוסח המקרא: <strong>תנ״ך עם טעמי המקרא</strong> — מתוך
      <a href="https://github.com/Sefaria/Sefaria-Export" rel="noopener noreferrer" target="_blank">Sefaria</a>
      (מקור: tanach.us), נחלת הכלל. <span id="verse-count"></span>
    </p>
    <p class="footer-note">
      המנהג: בסוף תפילת העמידה אומרים פסוק המתחיל באות הראשונה של השם ומסתיים באות האחרונה שלו.
    </p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
