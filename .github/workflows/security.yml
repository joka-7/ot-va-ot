name: Security

on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Audits the pinned requirements files rather than the ambient
      # environment, so the result reflects what actually ships in the image.
      - name: pip-audit
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  sast:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      # -ll reports medium severity and above. tests/ is left out: assert-based
      # test code trips B101 by design.
      - name: Run bandit
        run: bandit -r app scripts -ll

  secret-scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run the gitleaks CLI directly rather than gitleaks-action@v2: the action
      # lists the PR's commits via the GitHub API, which fails with 403 under the
      # default CI token permissions. A direct CLI scan needs no API access.
      #
      # Full history, not the PR diff: a credential removed in a later commit is
      # still in the pack and still valid until it is rotated.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --redact --verbose

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload SARIF
        # Non-blocking until "Code scanning" is enabled in the repository
        # settings: without it the upload errors with "Code scanning is not
        # enabled for this repository".
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

      - name: Perform CodeQL analysis
        # Non-blocking until "Code scanning" is enabled in the repository
        # settings: the analysis runs, but its SARIF upload step errors with
        # "Code scanning is not enabled for this repository". continue-on-error
        # on this step lets the job conclude successfully (green check) while
        # still running the analysis. Once code scanning is enabled, remove this.
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
