name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff mypy pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy app

      # The floor is set just under the measured 97% rather than at a round
      # aspirational number: a gate that fails the day it lands gets disabled.
      - name: Tests with a coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=95

  docs-drift:
    name: Docs tree is current
    runs-on: ubuntu-latest
    steps:
      # docs/STRUCTURE.md is generated from the real tree. A directory map that
      # nothing verifies drifts silently and becomes actively misleading, so
      # this fails the build when the committed tree no longer matches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The generator lives in the .ai submodule. ogen-ai is public, so this
          # needs no credentials.
          submodules: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Both generated trees are checked: the full one in docs/ and the depth-1
      # summary in the README. Checking only one lets the other rot.
      - name: Check the generated trees against the repository
        run: |
          python .ai/skills/repo_tree/gen_tree.py --project . --output docs/STRUCTURE.md --check
          python .ai/skills/repo_tree/gen_tree.py --project . --output README.md --max-depth 1 --check
