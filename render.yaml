# One-click deploy to Render: https://render.com/deploy
services:
  - type: web
    name: pasuk-leshem
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Origins allowed to call this API from a browser (comma-separated).
      # The UI is also deployed to Vercel, which makes that copy cross-origin;
      # see app/main.py for the allowlist and static/config.js for why. Leave
      # unset and the default in app/main.py applies -- set it here only when
      # the frontend moves to a domain that default doesn't cover.
      - key: ALLOWED_ORIGINS
        sync: false
      # ENABLED_COMMENTARIES is deliberately not set: unset serves every commentary
      # shown in the reader besides Rashi (app/commentary.py). Set it in the dashboard only to
      # serve fewer (an empty value serves none). Each is read a book at a time from
      # data/<id>.zip, so they add little memory (about 131MB at start, 162MB with every book of all of them read).
