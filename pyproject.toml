# Tool configuration only. This project is a deployed service, not a
# distributable package, so there is deliberately no [project] or
# [build-system] table -- dependencies stay in requirements.txt, which is what
# the Dockerfile and render.yaml install from.

[tool.ruff]
line-length = 100
target-version = "py312"
# .ai is the ogen-ai submodule -- vendored config, not this repo's source. Left
# in, ruff lints it and reports findings nobody here can fix, against a
# different project's conventions.
extend-exclude = [".ai"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "EXE"]
# RUF001/2/3 flag characters that could be confused with ASCII lookalikes. This
# is a Hebrew corpus app: its source, tests and fixtures are full of Hebrew
# letters and punctuation that the rule reads as suspicious homoglyphs -- 54 of
# 57 findings on first run were Hebrew text doing exactly what it should. The
# rule cannot be satisfied here without mangling the data, so it is off rather
# than suppressed line by line.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
# app/ has no __init__.py and is imported as a namespace package by uvicorn
# (app.main:app). Without these, mypy cannot resolve the relative imports and
# reports every one of them as a missing module.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
